<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slack Scheduler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { font-family: 'Noto Sans KR', sans-serif; }
      @keyframes fade-in-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in-up { animation: fade-in-up 0.2s ease-out; }
      input[type='date']::-webkit-calendar-picker-indicator,
      input[type='time']::-webkit-calendar-picker-indicator { filter: invert(0.7); }
      .scrollbar::-webkit-scrollbar { width: 8px; }
      .scrollbar::-webkit-scrollbar-track { background: #111827; }
      .scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
  </head>
  <body class="bg-gray-950 text-gray-100">
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
      const { useState, useEffect, useCallback, useRef, useMemo } = React;

      // ───── Icons ─────────────────────────────────────────────
      const svgBase = { fill:'none', stroke:'currentColor', strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round', viewBox:'0 0 24 24' };
      const mkIcon = (children) => ({ size = 24, className = '' }) =>
        React.createElement('svg', { width: size, height: size, className, ...svgBase }, children);

      const Settings = mkIcon([<circle key="c" cx="12" cy="12" r="3" />, <path key="p" d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />]);
      const MessageSquare = mkIcon(<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />);
      const Clock = mkIcon([<circle key="c" cx="12" cy="12" r="10" />, <polyline key="p" points="12 6 12 12 16 14" />]);
      const Calendar = mkIcon([<rect key="r" x="3" y="4" width="18" height="18" rx="2" ry="2" />, <line key="l1" x1="16" y1="2" x2="16" y2="6" />, <line key="l2" x1="8" y1="2" x2="8" y2="6" />, <line key="l3" x1="3" y1="10" x2="21" y2="10" />]);
      const CheckCircle2 = mkIcon([<circle key="c" cx="12" cy="12" r="10" />, <path key="p" d="m9 12 2 2 4-4" />]);
      const Trash2 = mkIcon([<polyline key="p1" points="3 6 5 6 21 6" />, <path key="p2" d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6" />, <path key="p3" d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 1 1 2 2v2" />, <line key="l1" x1="10" y1="11" x2="10" y2="17" />, <line key="l2" x1="14" y1="11" x2="14" y2="17" />]);
      const Send = mkIcon([<line key="l" x1="22" y1="2" x2="11" y2="13" />, <polygon key="p" points="22 2 15 22 11 13 2 9 22 2" />]);
      const Plus = mkIcon([<line key="l1" x1="12" y1="5" x2="12" y2="19" />, <line key="l2" x1="5" y1="12" x2="19" y2="12" />]);
      const Users = mkIcon([<path key="p1" d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />, <circle key="c" cx="9" cy="7" r="4" />, <path key="p2" d="M23 21v-2a4 4 0 0 0-3-3.87" />, <path key="p3" d="M16 3.13a4 4 0 0 1 0 7.75" />]);
      const Hash = mkIcon([<line key="l1" x1="4" y1="9" x2="20" y2="9" />, <line key="l2" x1="4" y1="15" x2="20" y2="15" />, <line key="l3" x1="10" y1="3" x2="8" y2="21" />, <line key="l4" x1="16" y1="3" x2="14" y2="21" />]);
      const Play = mkIcon(<polygon points="5 3 19 12 5 21 5 3" />);
      const Pause = mkIcon([<rect key="r1" x="6" y="4" width="4" height="16" />, <rect key="r2" x="14" y="4" width="4" height="16" />]);
      const Repeat = mkIcon([<polyline key="p1" points="17 1 21 5 17 9" />, <path key="p2" d="M3 11V9a4 4 0 0 1 4-4h14" />, <polyline key="p3" points="7 23 3 19 7 15" />, <path key="p4" d="M21 13v2a4 4 0 0 1-4 4H3" />]);
      const X = mkIcon([<line key="l1" x1="18" y1="6" x2="6" y2="18" />, <line key="l2" x1="6" y1="6" x2="18" y2="18" />]);
      const Link2 = mkIcon([<path key="p1" d="M9 17H7A5 5 0 0 1 7 7h2" />, <path key="p2" d="M15 7h2a5 5 0 1 1 0 10h-2" />, <line key="l" x1="8" y1="12" x2="16" y2="12" />]);
      const LogOut = mkIcon([<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />, <polyline points="16 17 21 12 16 7" />, <line x1="21" y1="12" x2="9" y2="12" />]);
      const Pencil = mkIcon([<path key="p1" d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />, <path key="p2" d="m15 5 4 4" />]);
      const Ban = mkIcon([<circle key="c" cx="12" cy="12" r="10" />, <line key="l" x1="4.93" y1="4.93" x2="19.07" y2="19.07" />]);

      // ───── Dynamic URL Resolution for Blob Iframe Sandbox ───
      const getBaseUrl = () => {
        let base = window.location.origin;
        if (!base || base === 'null' || window.location.protocol === 'blob:') {
          // Extract the actual web origin from the Blob URL (e.g., blob:https://xxx.goog/uuid)
          const match = window.location.href.match(/^blob:(https?:\/\/[^\/]+)/);
          if (match) {
            base = match[1];
          } else {
            base = (window.location.protocol === 'https:' ? 'https://' : 'http://') + window.location.host;
          }
        }
        return base;
      };

      const resolveUrl = (path) => {
        const base = getBaseUrl();
        const cleanPath = path.startsWith('/') ? path : '/' + path;
        return `${base}${cleanPath}`;
      };

      // ───── API ──────────────────────────────────────────────
      // 401 발생 시 로그인 화면으로 강제 이동시키기 위한 헬퍼
      let on401Handler = null;
      const fetchAuthed = async (url, opts = {}) => {
        const r = await fetch(url, { credentials: 'same-origin', ...opts });
        if (r.status === 401) {
          if (on401Handler) on401Handler();
          throw new Error('로그인이 필요합니다.');
        }
        return r;
      };

      const api = {
        async list() { const r = await fetchAuthed(resolveUrl('/api/schedules')); if (!r.ok) throw new Error('목록 조회 실패'); return r.json(); },
        async create(p) { const r = await fetchAuthed(resolveUrl('/api/schedules'), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(p) }); if (!r.ok) throw new Error((await r.json()).error || '생성 실패'); return r.json(); },
        async remove(id) { const r = await fetchAuthed(resolveUrl('/api/schedules/'+id), { method:'DELETE' }); if (!r.ok) throw new Error('삭제 실패'); },
        async toggle(id) { const r = await fetchAuthed(resolveUrl('/api/schedules/'+id+'/toggle'), { method:'PATCH' }); if (!r.ok) throw new Error((await r.json()).error || '상태 변경 실패'); return r.json(); },
        async testSend(p) { const r = await fetchAuthed(resolveUrl('/api/test-send'), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(p) }); const d = await r.json(); if (!r.ok) throw new Error(d.error || '전송 실패'); return d; },
        async auth() { const r = await fetch(resolveUrl('/api/auth')); return r.json(); },
        async channels(refresh=false) { const r = await fetchAuthed(resolveUrl('/api/slack/channels' + (refresh?'?refresh=1':''))); if (!r.ok) throw new Error((await r.json()).error || '채널 목록 조회 실패'); return r.json(); },
        async users(refresh=false) { const r = await fetchAuthed(resolveUrl('/api/slack/users' + (refresh?'?refresh=1':''))); if (!r.ok) throw new Error((await r.json()).error || '사용자 목록 조회 실패'); return r.json(); },

        async getSession() { const r = await fetch(resolveUrl('/api/auth/session'), { credentials: 'same-origin' }); if (!r.ok) return null; return r.json(); },
        async logoutSession() { await fetch(resolveUrl('/api/auth/logout'), { method: 'POST', credentials: 'same-origin' }); },
        async update(id, p) { const r = await fetchAuthed(resolveUrl('/api/schedules/'+id), { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(p) }); if (!r.ok) throw new Error((await r.json()).error || '수정 실패'); return r.json(); },
        async skipDate(id, action, date) { const r = await fetchAuthed(resolveUrl('/api/schedules/'+id+'/skip-dates'), { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ action, date }) }); if (!r.ok) throw new Error((await r.json()).error || '날짜 처리 실패'); return r.json(); },
        registerOn401(fn) { on401Handler = fn; },
      };

      // ───── ChannelUserPicker: multi-select with Slack data ─────
      function ChannelUserPicker({ selected, onChange, onError }) {
        const [channels, setChannels] = useState([]);
        const [users, setUsers] = useState([]);
        const [loading, setLoading] = useState(true);
        const [open, setOpen] = useState(false);
        const [query, setQuery] = useState('');
        const [highlightIdx, setHighlightIdx] = useState(0);
        const containerRef = useRef(null);
        const inputRef = useRef(null);

        useEffect(() => {
          Promise.all([api.channels(), api.users()])
            .then(([ch, us]) => { setChannels(ch); setUsers(us); })
            .catch((e) => onError && onError(e.message))
            .finally(() => setLoading(false));
        }, []);

        useEffect(() => {
          if (!open) return;
          const handler = (e) => { if (containerRef.current && !containerRef.current.contains(e.target)) setOpen(false); };
          document.addEventListener('mousedown', handler);
          return () => document.removeEventListener('mousedown', handler);
        }, [open]);

        const isSelected = (id) => selected.some((s) => s.id === id);

        const add = (item) => {
          if (isSelected(item.id)) return;
          onChange([...selected, item]);
          setQuery('');
          setHighlightIdx(0);
          inputRef.current?.focus();
        };
        const remove = (id) => onChange(selected.filter((s) => s.id !== id));

        const q = query.toLowerCase().trim();
        const filteredChannels = channels
          .filter((c) => !isSelected(c.id) && (q === '' || c.name.toLowerCase().includes(q)))
          .slice(0, 50);
        const filteredUsers = users
          .filter((u) => !isSelected(u.id) && (q === '' ||
            u.displayName.toLowerCase().includes(q) ||
            u.name.toLowerCase().includes(q) ||
            (u.realName && u.realName.toLowerCase().includes(q))))
          .slice(0, 50);

        // 키보드 탐색용 통합 리스트 (채널 먼저, 그다음 사용자)
        const combinedList = [
          ...filteredChannels.map((c) => ({ kind: 'channel', item: c })),
          ...filteredUsers.map((u) => ({ kind: 'user', item: u })),
        ];

        useEffect(() => { setHighlightIdx(0); }, [query, channels.length, users.length]);

        const handleKeyDown = (e) => {
          if (!open) return;
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            setHighlightIdx((i) => Math.min(combinedList.length - 1, i + 1));
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            setHighlightIdx((i) => Math.max(0, i - 1));
          } else if (e.key === 'Enter') {
            e.preventDefault();
            const top = combinedList[highlightIdx] || combinedList[0];
            if (!top) return;
            if (top.kind === 'channel') {
              add({ type: 'channel', id: top.item.id, name: top.item.name });
            } else {
              add({ type: 'user', id: top.item.id, name: top.item.displayName });
            }
          } else if (e.key === 'Escape') {
            setOpen(false);
          } else if (e.key === 'Backspace' && query === '' && selected.length > 0) {
            // 빈 입력에서 백스페이스 → 마지막 선택 제거
            e.preventDefault();
            remove(selected[selected.length - 1].id);
          }
        };

        return (
          <div className="relative" ref={containerRef}>
            <div
              className="min-h-[44px] flex flex-wrap items-center gap-1.5 p-2 border border-gray-700 bg-gray-950 rounded-lg focus-within:ring-1 focus-within:ring-pink-500 focus-within:border-pink-500 cursor-text"
              onClick={() => { setOpen(true); inputRef.current?.focus(); }}
            >
              {selected.map((item) => (
                <span
                  key={item.id}
                  className={
                    'inline-flex items-center gap-1 pl-2 pr-1 py-1 rounded-md text-xs font-medium ' +
                    (item.type === 'channel'
                      ? 'bg-blue-900/40 text-blue-300 border border-blue-800/60'
                      : 'bg-green-900/40 text-green-300 border border-green-800/60')
                  }
                >
                  {item.type === 'channel' ? <Hash size={12} /> : <Users size={12} />}
                  <span>{item.name}</span>
                  <button
                    type="button"
                    onClick={(e) => { e.stopPropagation(); remove(item.id); }}
                    className="hover:bg-black/30 rounded p-0.5 ml-0.5"
                  >
                    <X size={12} />
                  </button>
                </span>
              ))}
              <input
                ref={inputRef}
                type="text"
                value={query}
                onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
                onFocus={() => setOpen(true)}
                onKeyDown={handleKeyDown}
                placeholder={selected.length === 0 ? '검색 후 ↵엔터로 추가 (↑↓로 탐색)' : '추가하려면 검색...'}
                className="flex-1 min-w-[180px] bg-transparent outline-none text-sm text-gray-200 placeholder-gray-600 py-1 px-1"
              />
            </div>

            {open && (
              <div className="scrollbar absolute z-20 left-0 right-0 mt-1 bg-gray-900 border border-gray-700 rounded-lg shadow-2xl max-h-80 overflow-y-auto">
                {loading ? (
                  <div className="p-4 text-center text-sm text-gray-500">슬랙에서 목록을 가져오는 중...</div>
                ) : filteredChannels.length === 0 && filteredUsers.length === 0 ? (
                  <div className="p-4 text-center text-sm text-gray-500">
                    {channels.length + users.length === 0 ? '데이터를 불러올 수 없습니다.' : '검색 결과 없음'}
                  </div>
                ) : (
                  <>
                    {filteredChannels.length > 0 && (
                      <div>
                        <div className="px-3 py-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider bg-gray-950/50 border-b border-gray-800 sticky top-0">채널</div>
                        {filteredChannels.map((c, idx) => {
                          const flatIdx = idx;
                          const isHi = flatIdx === highlightIdx;
                          return (
                            <button
                              key={c.id}
                              type="button"
                              onClick={() => add({ type:'channel', id:c.id, name:c.name })}
                              onMouseEnter={() => setHighlightIdx(flatIdx)}
                              className={'w-full text-left px-3 py-2 flex items-center gap-2 text-sm text-gray-300 ' + (isHi ? 'bg-pink-900/30 border-l-2 border-pink-500' : 'hover:bg-gray-800 border-l-2 border-transparent')}
                            >
                              <Hash size={14} className="text-blue-400 shrink-0" />
                              <span className="truncate">{c.name}</span>
                              {c.isPrivate && <span className="text-xs text-gray-500 shrink-0">(비공개)</span>}
                              {!c.isMember && (
                                <span className="text-xs text-yellow-500/80 ml-auto shrink-0" title="공개 채널은 봇 초대 없이도 전송 가능합니다.">
                                  {c.isPrivate ? '⚠ 봇 미초대' : '봇 미초대'}
                                </span>
                              )}
                            </button>
                          );
                        })}
                      </div>
                    )}
                    {filteredUsers.length > 0 && (
                      <div>
                        <div className="px-3 py-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider bg-gray-950/50 border-b border-gray-800 sticky top-0">사람</div>
                        {filteredUsers.map((u, idx) => {
                          const flatIdx = filteredChannels.length + idx;
                          const isHi = flatIdx === highlightIdx;
                          return (
                            <button
                              key={u.id}
                              type="button"
                              onClick={() => add({ type:'user', id:u.id, name:u.displayName })}
                              onMouseEnter={() => setHighlightIdx(flatIdx)}
                              className={'w-full text-left px-3 py-2 flex items-center gap-2 text-sm text-gray-300 ' + (isHi ? 'bg-pink-900/30 border-l-2 border-pink-500' : 'hover:bg-gray-800 border-l-2 border-transparent')}
                            >
                              {u.avatar ? (
                                <img src={u.avatar} className="w-5 h-5 rounded shrink-0" alt="" />
                              ) : (
                                <div className="w-5 h-5 rounded bg-green-900/40 flex items-center justify-center shrink-0">
                                  <Users size={12} className="text-green-400" />
                                </div>
                              )}
                              <span className="truncate">{u.displayName}</span>
                              {u.realName && u.realName !== u.displayName && (
                                <span className="text-xs text-gray-500 truncate">· {u.realName}</span>
                              )}
                            </button>
                          );
                        })}
                      </div>
                    )}
                  </>
                )}
              </div>
            )}
          </div>
        );
      }

      // ───── FormatToolbar: Slack-style text formatting ─────
      function FormatToolbar({ value, onChange, textareaRef }) {
        // 포커스·선택영역·스크롤 위치를 모두 복원 (마크다운 버튼 클릭 후 textarea가 맨 위로 튀는 현상 방지)
        const restoreFocus = (start, length, savedScrollTop) => {
          requestAnimationFrame(() => {
            const ta = textareaRef.current;
            if (!ta) return;
            ta.focus({ preventScroll: true });
            ta.setSelectionRange(start, start + length);
            if (typeof savedScrollTop === 'number') ta.scrollTop = savedScrollTop;
          });
        };

        const wrap = (before, after = before, placeholder = '텍스트') => {
          const ta = textareaRef.current;
          if (!ta) return;
          const start = ta.selectionStart;
          const end = ta.selectionEnd;
          const savedScroll = ta.scrollTop;
          const selected = value.substring(start, end);
          const inner = selected || placeholder;
          const newValue = value.substring(0, start) + before + inner + after + value.substring(end);
          onChange(newValue);
          restoreFocus(start + before.length, inner.length, savedScroll);
        };

        const prefixLines = (prefixFn) => {
          const ta = textareaRef.current;
          if (!ta) return;
          const start = ta.selectionStart;
          const end = ta.selectionEnd;
          const savedScroll = ta.scrollTop;
          const lineStart = value.lastIndexOf('\n', start - 1) + 1;
          const searchFrom = end > start && value[end - 1] === '\n' ? end - 1 : end;
          const nextNewline = value.indexOf('\n', searchFrom);
          const lineEnd = nextNewline === -1 ? value.length : nextNewline;
          const block = value.substring(lineStart, lineEnd);
          const lines = block.split('\n');
          const prefixed = lines.map((line, i) => prefixFn(line, i)).join('\n');
          const newValue = value.substring(0, lineStart) + prefixed + value.substring(lineEnd);
          onChange(newValue);
          restoreFocus(lineStart, prefixed.length, savedScroll);
        };

        const insertLink = () => {
          const ta = textareaRef.current;
          if (!ta) return;
          const start = ta.selectionStart;
          const end = ta.selectionEnd;
          const savedScroll = ta.scrollTop;
          const selected = value.substring(start, end);
          const url = window.prompt('URL을 입력하세요:', 'https://');
          if (!url) return;
          const text = selected || window.prompt('표시할 텍스트 (비워두면 URL 그대로):', '') || '';
          const link = text ? `<${url}|${text}>` : `<${url}>`;
          const newValue = value.substring(0, start) + link + value.substring(end);
          onChange(newValue);
          restoreFocus(start + link.length, 0, savedScroll);
        };

        // 미리보기 토글 (FormatToolbar 외부에서 관리하므로 여기서는 prop으로 받음)

        const btn = 'min-w-[28px] h-8 px-2 text-gray-400 hover:text-pink-400 hover:bg-gray-800 rounded text-sm font-medium transition-colors flex items-center justify-center';
        const divider = <div className="w-px h-5 bg-gray-700 mx-0.5" />;

        return (
          <div className="flex items-center gap-0.5 px-2 py-1.5 bg-gray-900 border border-gray-700 rounded-t-lg border-b-0 flex-wrap">
            <button type="button" className={btn + ' font-bold'} onClick={() => wrap('*')} title="굵게 (*텍스트*)">B</button>
            <button type="button" className={btn + ' italic'} onClick={() => wrap('_')} title="기울임 (_텍스트_)"><span style={{fontFamily:'serif'}}>I</span></button>
            <button type="button" className={btn + ' line-through'} onClick={() => wrap('~')} title="취소선 (~텍스트~)">S</button>
            {divider}
            <button type="button" className={btn + ' font-mono'} onClick={() => wrap('`')} title="인라인 코드">&lt;/&gt;</button>
            <button type="button" className={btn + ' font-mono text-xs'} onClick={() => wrap('```\n', '\n```', '코드')} title="코드 블록">{'{ }'}</button>
            <button type="button" className={btn} onClick={insertLink} title="링크 삽입"><Link2 size={14} /></button>
            {divider}
            <button type="button" className={btn} onClick={() => prefixLines((l) => '> ' + l)} title="인용">”</button>
            <button type="button" className={btn} onClick={() => prefixLines((l) => '• ' + l)} title="글머리 기호">•</button>
            <button type="button" className={btn + ' text-xs'} onClick={() => prefixLines((l, i) => (i + 1) + '. ' + l)} title="번호 매기기">1.</button>

          </div>
        );
      }

      // ───── Helpers ──────────────────────────────────────────
      const DAYS = [
        { id:'1', label:'월' }, { id:'2', label:'화' }, { id:'3', label:'수' },
        { id:'4', label:'목' }, { id:'5', label:'금' }, { id:'6', label:'토' }, { id:'0', label:'일' },
      ];

      function formatDaysDisplay(selectedDays) {
        if (selectedDays.length === 7) return '매일';
        if (selectedDays.length === 5 && !selectedDays.includes('0') && !selectedDays.includes('6')) return '평일';
        if (selectedDays.length === 2 && selectedDays.includes('0') && selectedDays.includes('6')) return '주말';
        const order = ['1','2','3','4','5','6','0'];
        return [...selectedDays].sort((a,b) => order.indexOf(a) - order.indexOf(b))
          .map((id) => DAYS.find((d) => d.id === id)?.label).join(',');
      }

      function formatOnceDate(dateStr) {
        const d = new Date(dateStr + 'T00:00:00');
        const dn = ['일','월','화','수','목','금','토'][d.getDay()];
        return `${d.getMonth() + 1}월 ${d.getDate()}일(${dn})`;
      }

      function todayStr() {
        const n = new Date();
        return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
      }

      // 슬랙 마크다운 → HTML 변환 (미리보기·카드 표시용)
      function renderSlackMd(text) {
        if (!text) return '';
        // HTML 이스케이프하되 슬랙 < > 는 임시 토큰으로 보존
        let html = text
          .replace(/&/g, '&amp;')
          .replace(/</g, '\x01')
          .replace(/>/g, '\x02');
        // 슬랙 링크: <url|label> / <url>
        html = html
          .replace(/\x01(https?:\/\/[^|\x02]+)\|([^\x02]+)\x02/g,
            '<a href="$1" target="_blank" rel="noopener noreferrer" class="text-pink-400 underline hover:text-pink-300">$2</a>')
          .replace(/\x01(https?:\/\/[^\x02]+)\x02/g,
            '<a href="$1" target="_blank" rel="noopener noreferrer" class="text-pink-400 underline hover:text-pink-300">$1</a>');
        // 잔여 < > 는 엔티티로 복원
        html = html.replace(/\x01/g, '&lt;').replace(/\x02/g, '&gt;');
        // 코드 블록 (멀티라인)
        html = html.replace(/```([\s\S]+?)```/g,
          '<pre class="bg-gray-800 p-2 rounded text-xs my-1 whitespace-pre-wrap font-mono">$1</pre>');
        // 인라인 코드
        html = html.replace(/`([^`\n]+)`/g,
          '<code class="bg-gray-800 px-1 py-0.5 rounded text-xs font-mono">$1</code>');
        // 굵게 / 기울임 / 취소선
        html = html
          .replace(/\*([^*\n]+)\*/g, '<strong>$1</strong>')
          .replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,!?;:]|$)/g, '$1<em>$2</em>')
          .replace(/~([^~\n]+)~/g, '<s>$1</s>');
        // 개인화 변수 강조 ({이름}, {name})
        html = html.replace(/\{(이름|name)\}/gi,
          '<span class="bg-indigo-900/40 text-indigo-300 px-1.5 py-0.5 rounded text-xs font-semibold">$&</span>');
        // 인용 (라인 시작 "> ")
        html = html.replace(/^&gt; (.+)$/gm,
          '<div class="border-l-2 border-gray-600 pl-3 text-gray-400 my-1">$1</div>');
        // 줄바꿈
        html = html.replace(/\n/g, '<br>');
        return html;
      }

                  )}

                      }

                      {t.name}
                    </span>
                  ))}
                  {msg.targets.length > 5 && (
                    <span className="text-xs text-gray-500">외 {msg.targets.length - 5}곳</span>
                  )}
                </div>

                <p className="text-sm text-gray-400 flex items-center gap-1 flex-wrap">
                  <Clock size={13} />
                  {isOnce ? (
                    <span>{formatOnceDate(msg.date)} {msg.time}</span>

                    <>
                      <span>{msg.time} ({formatDaysDisplay(msg.daysOfWeek)})</span>
                      <span className="text-gray-600 mx-1">·</span>
                      <span>{msg.startDate} ~ {msg.endDate}</span>
                    </>
                  )}
                </p>
              </div>
              <div className="flex space-x-1 shrink-0">
                <button
                  onClick={() => onEdit(msg)}
                  className="p-2 text-gray-500 hover:text-blue-400 hover:bg-blue-900/20 rounded-lg transition-colors"
                  title="수정"
                >
                  <Pencil size={18} />
                </button>
                {msg.status !== 'completed' && (
                  <button
                    onClick={() => onToggle(msg.id)}
                    className="p-2 text-gray-500 hover:text-pink-500 hover:bg-gray-800 rounded-lg transition-colors"
                    title={msg.status === 'active' ? '일시정지' : '활성화'}

                  </button>
                )}
                <button
                  onClick={() => onDelete(msg.id)}
                  className="p-2 text-gray-500 hover:text-red-400 hover:bg-red-900/20 rounded-lg transition-colors"

            <div

            />

            {/* 건너뛸 날짜 (반복 예약만) */}
            {!isOnce && (
              <div className="mt-3 pt-3 border-t border-gray-800">

                      <span className="bg-orange-900/40 text-orange-300 border border-orange-800/60 rounded-full px-1.5 py-0.5 text-xs">
                        {msg.skipDates.length}

                  </span>
                  {msg.status !== 'completed' && (
                    <button

                        {formatOnceDate(d)}
                        <button
                          type="button"
                          onClick={() => onRemoveSkipDate(msg.id, d)}
                          className="hover:text-red-400 transition-colors ml-0.5"
                          title="건너뛰기 해제"
                        >
                          <X size={10} />

                      </span>
                    ))}

                {showSkipInput && (
                  <div className="flex items-center gap-2">

                      style={{ colorScheme: 'dark' }}

                      type="button"
                      onClick={handleAddSkip}

                      type="button"

                )}

                {!msg.skipDates?.length && !showSkipInput && (
                  <p className="text-xs text-gray-600">없음 — 위 버튼으로 특정 날짜를 건너뛸 수 있어요.</p>
                )}
              </div>
            )}
          </div>
        );
      }

      // ───── Main app ─────────────────────────────────────────
      function SlackSchedulerBot() {
        const [activeTab, setActiveTab] = useState('dashboard');
        const [scheduledMessages, setScheduledMessages] = useState([]);
        const [loading, setLoading] = useState(true);
        const [workspace, setWorkspace] = useState(null);

        // 간편 OAuth 로그인 상태 관리
        const [currentUser, setCurrentUser] = useState(null); // { name, avatar, userId }

        const [scheduleType, setScheduleType] = useState('recurring');
        const [senderType, setSenderType] = useState('bot'); // 'bot' or 'user'
        
        const [targets, setTargets] = useState([]);
        const [messageText, setMessageText] = useState('');
        const [date, setDate] = useState('');
        const [startDate, setStartDate] = useState('');
        const [endDate, setEndDate] = useState('');
        const [time, setTime] = useState('');
        const [daysOfWeek, setDaysOfWeek] = useState([]);
        const [submitting, setSubmitting] = useState(false);
        const [editingId, setEditingId] = useState(null);
        const [showPreview, setShowPreview] = useState(true);
        const textareaRef = useRef(null);

        const [toastMessage, setToastMessage] = useState('');
        const [toastType, setToastType] = useState('success');
        const [showToast, setShowToast] = useState(false);

        const showNotification = useCallback((message, type = 'success') => {
          setToastMessage(message); setToastType(type); setShowToast(true);
          setTimeout(() => setShowToast(false), 3500);
        }, []);

        const refresh = useCallback(async () => {
          try { setScheduledMessages(await api.list()); }
          catch (e) { showNotification(e.message, 'error'); }
        }, [showNotification]);

        // OAuth 세션 정보 검증
        const checkUserSession = useCallback(async () => {
          try {
            const session = await api.getSession();
            if (session && session.connected) {
              setCurrentUser({
                name: session.userName,
                avatar: session.userAvatar,
                userId: session.userId
              });
              setSenderType('user'); // 연동되어 있다면 자동으로 내 계정 발송 모드로 우선 세팅
            } else {
              setCurrentUser(null);
              setSenderType('bot');
            }
          } catch (e) {
            console.error('세션 검증 실패:', e);
          }
        }, []);

        useEffect(() => {
          api.registerOn401(() => {
            setCurrentUser(null);
            setScheduledMessages([]);
            showNotification('로그인이 만료되었습니다. 다시 로그인해주세요.', 'error');
          });
          (async () => {
            const params = new URLSearchParams(window.location.search);
            const authError = params.get('auth_error');
            if (authError) {
              showNotification(authError, 'error');
              window.history.replaceState({}, '', '/');
            }
            try { const a = await api.auth(); if (a.ok) setWorkspace(a); } catch {}
            const session = await api.getSession();
            if (session?.connected) {
              setCurrentUser({ name: session.userName, avatar: session.userAvatar, userId: session.userId });
              setSenderType('user');
              try { setScheduledMessages(await api.list()); } catch (e) { showNotification(e.message, 'error'); }
            }
            setLoading(false);
          })();
        }, [showNotification]);

        // 슬랙 로그인 (OAuth) 팝업 / 리다이렉트 처리
        const handleSlackLogin = () => {
          // 백엔드의 Slack OAuth 주소로 이동 (사용자는 버튼 하나로 연동을 마칩니다)
          window.location.href = resolveUrl('/api/auth/slack');
        };

        const handleSlackLogout = async () => {
          if (!window.confirm('슬랙 계정 연동을 해제하시겠습니까?')) return;
          try {
            await api.logoutSession();
            showNotification('슬랙 계정 연동이 해제되었습니다.');
            setCurrentUser(null);
            setSenderType('bot');
          } catch (e) {
            showNotification('해제 실패: ' + e.message, 'error');
          }

        const resetForm = () => {
          setTargets([]); setMessageText('');
          setDate(''); setStartDate(''); setEndDate(''); setTime('');

          setEditingId(null);

          setMessageText(msg.messageText);
          setTime(msg.time);
          setDate(msg.date || '');
          setStartDate(msg.startDate || '');
          setEndDate(msg.endDate || '');
          setDaysOfWeek(msg.daysOfWeek ? [...msg.daysOfWeek] : []);
          setActiveTab('new');

        const handleScheduleMessage = async (e) => {
          e.preventDefault();
          if (targets.length === 0) return showNotification('받는 대상을 1명/1채널 이상 선택해주세요.', 'error');
          if (!messageText) return showNotification('메시지 내용을 입력해주세요.', 'error');
          if (!time) return showNotification('전송 시간을 선택해주세요.', 'error');
          if (scheduleType === 'once') {
            if (!date) return showNotification('날짜를 선택해주세요.', 'error');
          } else {
            if (!startDate || !endDate) return showNotification('시작일과 종료일을 선택해주세요.', 'error');
            if (endDate < startDate) return showNotification('종료일이 시작일보다 빠를 수 없습니다.', 'error');
            if (daysOfWeek.length === 0) return showNotification('반복 요일을 선택해주세요.', 'error');
          }

          if (senderType === 'user' && !currentUser) {
            return showNotification('먼저 내 슬랙 계정을 연동해 주세요.', 'error');
          }

          setSubmitting(true);
          try {
            const payload = {
              scheduleType,
              targets,
              messageText,
              time,
              senderType,
              ...(scheduleType === 'once' ? { date } : { startDate, endDate, daysOfWeek }),
            };
            if (editingId) {
              await api.update(editingId, payload);
              showNotification('메시지가 수정되었습니다.', 'success');
            } else {
              await api.create(payload);
              showNotification('메시지가 성공적으로 예약되었습니다.', 'success');
            }
            resetForm();
            await refresh();
            setActiveTab('dashboard');

          finally { setSubmitting(false); }

        const toggleDay = (id) =>
          setDaysOfWeek((d) => (d.includes(id) ? d.filter((x) => x !== id) : [...d, id]));

        const handleDelete = async (id) => {

          try { await api.toggle(id); await refresh(); }
          catch (e) { showNotification(e.message, 'error'); }
        };

        const handleAddSkipDate = async (id, date) => {
          try {
            const { skipDates } = await api.skipDate(id, 'add', date);
            setScheduledMessages((msgs) => msgs.map((m) => m.id === id ? { ...m, skipDates } : m));
            showNotification(`${date} 날짜를 건너뛰기로 설정했습니다.`);
          } catch (e) { showNotification(e.message, 'error'); }
        };

        const handleRemoveSkipDate = async (id, date) => {
          try {
            const { skipDates } = await api.skipDate(id, 'remove', date);
            setScheduledMessages((msgs) => msgs.map((m) => m.id === id ? { ...m, skipDates } : m));
            showNotification(`${date} 건너뛰기를 해제했습니다.`);
          } catch (e) { showNotification(e.message, 'error'); }
        };

        const handleTestSend = async () => {
          if (targets.length === 0) return showNotification('받는 대상을 먼저 선택해주세요.', 'error');
          if (!messageText) return showNotification('메시지 내용을 입력해주세요.', 'error');
          if (senderType === 'user' && !currentUser) return showNotification('먼저 내 슬랙 계정을 연동해 주세요.', 'error');

          try {
            const r = await api.testSend({ targets, messageText, senderType });
            const failed = (r.results || []).filter((x) => !x.success);
            if (failed.length === 0) showNotification(`테스트 메시지를 ${targets.length}곳에 보냈습니다.`);
            else showNotification(`${targets.length - failed.length}곳 성공, ${failed.length}곳 실패 (${failed.map(f=>f.error).join(', ')})`, 'error');
          } catch (e) { showNotification('전송 실패: ' + e.message, 'error'); }
        };

        // Stats
        const stats = useMemo(() => ({
          total: scheduledMessages.length,
          active: scheduledMessages.filter((m) => m.status === 'active').length,
          sentTotal: scheduledMessages.reduce((acc, m) => acc + (m.sentCount || 0), 0),
        }), [scheduledMessages]);

        const renderDashboard = () => (
          <div className="space-y-6">
            <div className="flex justify-between items-center">
              <h2 className="text-xl font-semibold text-gray-100">예약된 메시지 목록</h2>
              <button onClick={() => setActiveTab('new')} className="bg-pink-600 hover:bg-pink-700 text-white px-4 py-2 rounded-lg flex items-center text-sm transition-colors shadow-sm">
                <Plus size={16} className="mr-2" />새 메시지 예약
              </button>
            </div>

            {loading ? (
              <div className="bg-gray-900 rounded-xl border border-gray-800 p-12 text-center text-gray-400">불러오는 중...</div>
            ) : scheduledMessages.length === 0 ? (
              <div className="bg-gray-900 rounded-xl shadow-sm border border-gray-800 p-12 text-center">
                <div className="w-16 h-16 bg-gray-950 rounded-full flex items-center justify-center mx-auto mb-4 border border-gray-800">
                  <Calendar size={28} className="text-pink-500" />
                </div>

                      <span className="text-xs text-gray-200 font-medium max-w-[100px] truncate">{currentUser.name}</span>
                      <button 
                        onClick={handleSlackLogout} 
                        className="p-1 text-gray-400 hover:text-red-400 rounded-full transition-colors" 
                        title="로그아웃/연동해제"
                      >
                        <LogOut size={14} />
                      </button>
                    </div>
                  ) : (
                    <button 
                      onClick={handleSlackLogin} 
                      className="bg-[#4A154B] hover:bg-[#3F0E40] text-white text-xs font-semibold px-3 py-1.5 rounded-full flex items-center gap-1.5 transition-all shadow-md"
                    >
                      <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523 2.528 2.528 0 0 1-2.522-2.523 2.528 2.528 0 0 1 2.522-2.52h2.52v2.52zm1.261 0a2.528 2.528 0 0 1 2.52-2.52h5.043a2.528 2.528 0 0 1 2.522 2.52v5.042a2.528 2.528 0 0 1-2.522 2.52H8.823a2.528 2.528 0 0 1-2.52-2.52v-5.042zM8.823 5.043a2.528 2.528 0 0 1 2.52-2.52 2.528 2.528 0 0 1 2.522 2.52v2.52h-2.522a2.528 2.528 0 0 1-2.52-2.52zm0 1.261a2.528 2.528 0 0 1 2.52 2.52v5.043a2.528 2.528 0 0 1-2.52 2.522H3.78a2.528 2.528 0 0 1-2.522-2.522V8.824a2.528 2.528 0 0 1 2.522-2.52h5.043zm10.135 3.78a2.528 2.528 0 0 1 2.522-2.52 2.528 2.528 0 0 1 2.52 2.52 2.528 2.528 0 0 1-2.52 2.522h-2.522v-2.522zm-1.262 0a2.528 2.528 0 0 1-2.52 2.522h-5.043a2.528 2.528 0 0 1-2.522-2.522V3.78a2.528 2.528 0 0 1 2.522-2.52h5.043a2.528 2.528 0 0 1 2.52 2.52v5.043zm-3.78 10.135a2.528 2.528 0 0 1-2.522 2.52 2.528 2.528 0 0 1-2.52-2.52v-2.522h2.52a2.528 2.528 0 0 1 2.522 2.52v2.522zm0-1.262a2.528 2.528 0 0 1-2.522-2.52v-5.043a2.528 2.528 0 0 1 2.522-2.52h5.043a2.528 2.528 0 0 1 2.52 2.52v5.043h-5.043z"/>
                      </svg>
                      Sign in with Slack
                    </button>
                  )}
                </div>
              </div>
            </header>

            <main className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
              <div className="flex flex-col md:flex-row gap-8">
                <aside className="w-full md:w-64 shrink-0">
                  <nav className="space-y-1">
                    <button onClick={() => setActiveTab('dashboard')} className={'w-full flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all ' + (activeTab === 'dashboard' ? 'bg-gray-900 text-pink-400 shadow-sm border border-gray-800' : 'text-gray-400 hover:bg-gray-900/50')}>
                      <Calendar size={18} className="mr-3" />예약 대시보드
                    </button>
                    <button onClick={() => setActiveTab('new')} className={'w-full flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all ' + (activeTab === 'new' ? 'bg-gray-900 text-pink-400 shadow-sm border border-gray-800' : 'text-gray-400 hover:bg-gray-900/50')}>
                      <Plus size={18} className="mr-3" />새 예약 만들기
                    </button>
                  </nav>

                  {scheduledMessages.length > 0 && (
                    <div className="mt-8 bg-gray-900 border border-gray-800 rounded-xl p-4 space-y-3">
                      <h4 className="text-xs font-semibold text-pink-500 uppercase tracking-wider">통계</h4>
                      <div className="flex justify-between text-sm"><span className="text-gray-400">전체 예약</span><span className="font-medium text-gray-200">{stats.total}건</span></div>
                      <div className="flex justify-between text-sm"><span className="text-gray-400">활성</span><span className="font-medium text-green-400">{stats.active}건</span></div>
                      <div className="flex justify-between text-sm"><span className="text-gray-400">총 발송</span><span className="font-medium text-gray-200">{stats.sentTotal}회</span></div>
                    </div>
                  )}
                </aside>

                <div className="flex-1">{activeTab === 'dashboard' ? renderDashboard() : renderNewSchedule()}</div>
              </div>
            </main>

            {showToast && (
              <div className={'fixed bottom-4 right-4 border text-white px-6 py-3 rounded-lg shadow-lg flex items-center z-50 animate-fade-in-up max-w-md ' + (toastType === 'error' ? 'bg-red-900/80 border-red-700' : 'bg-gray-800 border-gray-700')}>
                <CheckCircle2 size={18} className={'mr-2 shrink-0 ' + (toastType === 'error' ? 'text-red-300' : 'text-green-400')} />
                <span className="text-sm">{toastMessage}</span>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<SlackSchedulerBot />);
    </script>
  </body>
</html>
